name: Apply pass adapter scope initialization update

on:
  push:
    branches: [fix/pass-scope-initialization]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, 'apply adapter scope initialization') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/pass-scope-initialization

      - name: Update call site and format
        run: |
          python .github/update-pass-scope-init.py
          cargo fmt --all
          rm -f .github/update-pass-scope-init.py
          rm -f .github/passless-scope-init.patch
          rm -f .github/passless-scope-init-error.txt
          rm -f .github/workflows/apply-pass-mod.yml

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(pass): apply adapter scope initialization"
          git push origin HEAD:fix/pass-scope-initialization
