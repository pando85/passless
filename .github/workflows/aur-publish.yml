name: aur-publish

on:
  workflow_run:
    workflows: ["Rust"]
    types:
      - completed
    # github.event.workflow_run.head_branch is the tag value without any prefix
    branches:
      - v[0-9]*

jobs:
  aur-publish:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    strategy:
      matrix:
        package:
          - name: passless
            pkgbuild: PKGBUILD
          - name: passless-bin
            pkgbuild: PKGBUILD-bin

    steps:
      - uses: actions/checkout@v7

      - name: Extract crate information
        shell: bash
        run: |
          echo "PROJECT_VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' ./Cargo.toml | head -n1)" >> $GITHUB_ENV

      - name: Create PKGBUILD
        shell: bash
        run: |
          curl -s https://api.github.com/repos/rash-sh/rash/releases/latest \
            | grep browser_download_url \
            | grep -v sha256 \
            | grep x86_64 \
            | grep linux \
            | grep gnu \
            | cut -d '"' -f 4 \
            | xargs curl -L \
            | tar xvz -C /usr/local/bin
          .ci/generate-pkgbuild.rh ${{ matrix.package.pkgbuild }}

      - name: Prepare AUR source signing key
        if: matrix.package.pkgbuild == 'PKGBUILD'
        shell: bash
        env:
          AUR_PGP_PUBLIC_KEY: ${{ secrets.AUR_PGP_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          fingerprint="CD1DB60B2C8465FD50028EF6D381D73787B45B3E"
          key_file=".ci/keys/pgp/${fingerprint}.asc"

          # A committed public key takes precedence over the optional Actions secret.
          if [[ ! -f "$key_file" ]]; then
            if [[ -z "$AUR_PGP_PUBLIC_KEY" ]]; then
              echo "::error::Commit $key_file or set the AUR_PGP_PUBLIC_KEY Actions secret (ASCII-armored public key)."
              exit 1
            fi
            mkdir -p "$(dirname "$key_file")"
            printf '%s\n' "$AUR_PGP_PUBLIC_KEY" > "$key_file"
          fi

          actual_fingerprint="$(gpg --batch --show-keys --with-colons --fingerprint "$key_file" |
            awk -F: '$1 == "pub" { primary = 1; next } primary && $1 == "fpr" { print $10; primary = 0 }')"
          if [[ "$actual_fingerprint" != "$fingerprint" ]]; then
            echo "::error::The AUR public key does not match the fingerprint in validpgpkeys."
            exit 1
          fi

      - name: Publish AUR package
        uses: KSXGitHub/github-actions-deploy-aur@v4.2.0
        with:
          pkgname: ${{ matrix.package.name }}
          pkgbuild: ./${{ matrix.package.pkgbuild }}
          assets: |
            .ci/passless.install
            ${{ matrix.package.pkgbuild == 'PKGBUILD' && '.ci/keys' || '' }}
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: Update ${{ matrix.package.name }} AUR package to version ${{ env.PROJECT_VERSION }}
          ssh_keyscan_types: rsa,ed25519
