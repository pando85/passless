name: Apply credential backup completion fix

on:
  push:
    branches:
      - agent/complete-credential-backup
    paths:
      - .github/workflows/apply-credential-backup-fix.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.repository == 'pando85/passless'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/complete-credential-backup
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply semantic completion fixes
        shell: python
        run: |
          from pathlib import Path

          auth_path = Path("cmd/passless/src/authenticator.rs")
          auth = auth_path.read_text()

          old = '''fn error_status_byte(error: SoftFido2Error) -> u8 {
              match error {
                  SoftFido2Error::CtapError(code) => code,
                  error => StatusCode::from(error) as u8,
              }
          }

          /// Classification of UV retry count transitions for diagnostic logging
          '''
          new = '''fn error_status_byte(error: SoftFido2Error) -> u8 {
              match error {
                  SoftFido2Error::CtapError(code) => code,
                  error => StatusCode::from(error) as u8,
              }
          }

          fn backup_state_for_export(
              source: CredentialBackupState,
          ) -> core::result::Result<CredentialBackupState, BackupError> {
              if !source.is_eligible() {
                  return Err(BackupError::UnsupportedCredential);
              }
              Ok(CredentialBackupState::BackedUp)
          }

          /// Classification of UV retry count transitions for diagnostic logging
          '''
          if old not in auth:
              raise SystemExit("failed to locate backup-state helper insertion point")
          auth = auth.replace(old, new, 1)

          old = '''                };
                          credential.backup_state = CredentialBackupState::BackedUp;
                          let bundle = match encrypt_credential(&credential, &recipient) {
          '''
          new = '''                };
                          credential.backup_state = match backup_state_for_export(credential.backup_state) {
                              Ok(state) => state,
                              Err(error) => {
                                  response.push(Self::backup_error_status(error) as u8);
                                  return;
                              }
                          };
                          let bundle = match encrypt_credential(&credential, &recipient) {
          '''
          if old not in auth:
              raise SystemExit("failed to locate backup prepare state transition")
          auth = auth.replace(old, new, 1)

          old = '''    #[test]
              fn test_get_info_tracks_runtime_pin_policy_without_consuming_uv_retries() {
          '''
          new = '''    #[test]
              fn test_backup_state_for_export_preserves_be_invariant() {
                  assert!(matches!(
                      backup_state_for_export(CredentialBackupState::NotEligible),
                      Err(BackupError::UnsupportedCredential)
                  ));
                  assert_eq!(
                      backup_state_for_export(CredentialBackupState::Eligible).unwrap(),
                      CredentialBackupState::BackedUp
                  );
                  assert_eq!(
                      backup_state_for_export(CredentialBackupState::BackedUp).unwrap(),
                      CredentialBackupState::BackedUp
                  );
              }

              #[test]
              fn test_get_info_tracks_runtime_pin_policy_without_consuming_uv_retries() {
          '''
          if old not in auth:
              raise SystemExit("failed to locate authenticator test insertion point")
          auth = auth.replace(old, new, 1)
          auth_path.write_text(auth)

          config_path = Path("passless-core/src/config.rs")
          config = config_path.read_text()
          config = config.replace(
              "/// Export one software-backed credential as an opaque OpenPGP bundle.",
              "/// Export one software-backed credential as an opaque encrypted bundle.",
              1,
          )
          config = config.replace(
              "/// OpenPGP recipient key ID, fingerprint, or email",
              "/// Authenticator-local credential-backup wrapping-key identifier",
              1,
          )
          if "OpenPGP recipient key ID, fingerprint, or email" in config:
              raise SystemExit("stale OpenPGP recipient help remains")
          config_path.write_text(config)
      - name: Format Rust sources
        run: cargo fmt --all
      - name: Remove one-shot workflow
        run: rm .github/workflows/apply-credential-backup-fix.yml
      - name: Commit completion fixes
        run: |
          git config user.name "openai-agent[bot]"
          git config user.email "openai-agent[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: preserve credential backup eligibility"
          git push origin HEAD:agent/complete-credential-backup
