name: Hardened issue 432 validator

on:
  push:
    branches:
      - automation/issue-432-pass-sync

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/issue-432-pass-sync
          fetch-depth: 0

      - name: Extract and apply implementation script
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/issue-432-apply.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(source) if line.strip() == "python3 <<'PY'") + 1
          end = next(i for i in range(start, len(source)) if source[i].strip() == 'PY')
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in source[start:end]) + '\n'
          old_helper = '''def replace_exact(path, old, new, count=1):
    p = Path(path)
    text = p.read_text()
    found = text.count(old)
    if found != count:
        raise SystemExit(f"{path}: expected {count} occurrences, found {found}: {old[:100]!r}")
    p.write_text(text.replace(old, new, count))
'''
          new_helper = '''def replace_exact(path, old, new, count=1):
    p = Path(path)
    text = p.read_text()
    found = text.count(old)
    if found == count:
        p.write_text(text.replace(old, new, count))
        return
    target = [line.strip() for line in old.splitlines()]
    lines = text.splitlines(keepends=True)
    width = len(target)
    matches = []
    for index in range(0, len(lines) - width + 1):
        if [line.strip() for line in lines[index:index + width]] == target:
            matches.append(index)
    if len(matches) != count:
        raise SystemExit(f"{path}: expected {count} normalized occurrences, found {len(matches)}: {old[:100]!r}")
    for index in reversed(matches):
        replacement = new
        if replacement and not replacement.endswith("\\n"):
            replacement += "\\n"
        lines[index:index + width] = [replacement]
    p.write_text(''.join(lines))
'''
          if old_helper not in script:
              raise SystemExit('could not locate replace_exact helper')
          script = script.replace(old_helper, new_helper, 1)
          Path('/tmp/apply-432.py').write_text(script)
          PY
          python3 /tmp/apply-432.py

      - name: Format
        run: cargo fmt --all

      - name: Verify formatting
        run: cargo fmt --all -- --check

      - name: Check workspace
        run: cargo check --workspace --all-targets

      - name: Test workspace
        run: cargo test --workspace --all-targets

      - name: Check agent feature
        run: cargo check -p passless-rs --all-targets --features agent

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Commit validated implementation
        shell: bash
        run: |
          git config user.name "openai-agent[bot]"
          git config user.email "openai-agent[bot]@users.noreply.github.com"
          git rm -- \
            .github/workflows/issue-432-apply.yml \
            .github/workflows/issue-432-pr-driver.yml \
            .github/workflows/issue-432-push-driver.yml
          git add -- \
            passless-core/src/config.rs \
            cmd/passless/src/main.rs \
            cmd/passless/src/storage/mod.rs \
            cmd/passless/src/storage/pass/mod.rs \
            cmd/passless/src/storage/pass/sync.rs \
            cmd/passless/src/storage/pass_refresh.rs \
            cmd/passless/src/pin_storage/pass.rs \
            cmd/passless/src/agent/storage_factory.rs
          git diff --cached --check
          git commit -m "fix(pass): batch git sync per operation"
          git push origin HEAD:automation/issue-432-pass-sync
