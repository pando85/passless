name: Session isolation bootstrap

on:
  push:
    branches:
      - feat/session-scoped-browser-isolation
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/session-scoped-browser-isolation

      - name: Decode deterministic transform
        shell: bash
        run: |
          base64 -d scripts/apply_session_isolation.py.b64 | gzip -d > /tmp/apply_session_isolation.py
          echo 'ae0e2e81c77c2a1232221660beb771e189dc9ab7b86bcbf0c3b9b345fa14e8e9  /tmp/apply_session_isolation.py' | sha256sum --check
          python3 -m py_compile /tmp/apply_session_isolation.py

      - name: Apply runtime ownership transform
        run: python3 /tmp/apply_session_isolation.py

      - name: Format changed Rust sources
        run: cargo fmt --all

      - name: Remove bootstrap files
        run: rm scripts/apply_session_isolation.py.b64 .github/workflows/session-isolation-bootstrap.yml

      - name: Commit generated implementation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- cmd/passless/src/agent/runtime.rs cmd/passless/src/agent/runtime/browser_ensure.rs cmd/passless/src/commands/agent.rs scripts/apply_session_isolation.py.b64 .github/workflows/session-isolation-bootstrap.yml
          git diff --cached --check
          git commit -m 'feat(agent): scope browser leases to principal sessions [session-bootstrap]'
          git push origin HEAD:feat/session-scoped-browser-isolation
