name: Credential backup implementation bootstrap

on:
  pull_request:
    branches: [master]
    types: [synchronize]

permissions:
  contents: write

jobs:
  implement:
    if: github.head_ref == 'agent/encrypted-credential-backup' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/encrypted-credential-backup
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gnupg2 libudev-dev libtss2-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy

      - uses: Swatinem/rust-cache@v2

      - name: Apply implementation
        run: |
          cat .github/agent-patch.part* | tr -d '\n' > /tmp/agent-credential-backup.b64
          echo 'd9b54fd19d3217590879cdb8d3d09633ee5ea2e7ab048a8d5ba7677c33c60bf5  /tmp/agent-credential-backup.b64' | sha256sum --check
          base64 -d /tmp/agent-credential-backup.b64 | gzip -d > /tmp/agent-credential-backup.py
          python3 /tmp/agent-credential-backup.py
          cargo update -p soft-fido2 --precise 0.16.0
          cargo update -p soft-fido2-ctap --precise 0.16.0
          cargo update -p soft-fido2-transport --precise 0.16.0
          cargo fmt --all

      - name: Check implementation
        run: |
          cargo fmt --all -- --check
          cargo check --workspace --all-targets
          cargo test --workspace --lib

      - name: Publish implementation commit
        run: |
          rm -f .github/agent-bootstrap.md
          rm -f .github/agent-credential-backup.py.gz.b64
          rm -f .github/agent-patch.part*
          rm -f .github/workflows/agent-credential-backup.yml
          git config user.name "OpenAI Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add encrypted credential backup and restore"
          git push origin HEAD:agent/encrypted-credential-backup
