name: Format Playwright bootstrap branch

on:
  push:
    branches:
      - feat/playwright-mcp-lazy-bootstrap
    paths:
      - .github/workflows/format-playwright-branch.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/playwright-mcp-lazy-bootstrap
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all
      - name: Commit rustfmt output
        run: |
          if git diff --quiet; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cmd/passless/src passless-core/src passless-core/tests
          git diff --cached --check
          git commit -m "style: apply rustfmt"
          git push origin HEAD:feat/playwright-mcp-lazy-bootstrap
