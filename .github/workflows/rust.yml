name: Rust

on:
  push:
    branches: [master]
    tags:
      - v[0-9]*
  pull_request:
    branches: [master]

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Install stable toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup override set stable

      - name: Run cargo fmt
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Update apt
        run: sudo apt update

      - name: Install udev and tss2 for TPM support
        run: sudo apt-get install -y libudev-dev libtss2-dev

      - name: Install stable toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup override set stable

      - name: Run cargo clippy
        run: cargo clippy --all-features -- --deny warnings

  agent-validation:
    name: Agent validation (deterministic)
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt-get install -y dbus-daemon gnupg2 libtss2-dev libudev-dev pass shellcheck swtpm

      - name: Install stable toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup override set stable

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Run deterministic agent validation
        run: make test-agent-validation

  agent-e2e:
    name: Agent E2E (real browser)
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt-get install -y bubblewrap dbus-daemon dbus-x11 libtss2-dev libudev-dev openssl xauth xvfb

      - name: Enable UHID and hidraw access for the runner user
        run: |
          sudo modprobe uhid
          printf '%s\n' \
            'KERNEL=="uhid", MODE="0666"' \
            'SUBSYSTEM=="hidraw", MODE="0666"' | sudo tee /etc/udev/rules.d/90-passless-e2e.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger
          sudo chmod 0666 /dev/uhid
          test -r /dev/uhid -a -w /dev/uhid

      - name: Allow unprivileged user namespaces (Chromium sandbox, bubblewrap)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install stable toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup override set stable

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Install harness dependencies and Playwright Chromium
        working-directory: tests/agent-e2e
        run: |
          npm ci --no-audit --no-fund
          # Playwright's Chromium goes into the harness cache only (never a shared cache).
          PLAYWRIGHT_BROWSERS_PATH="$GITHUB_WORKSPACE/target/agent-e2e-cache/ms-playwright" \
            node node_modules/playwright-core/cli.js install --with-deps chromium

      - name: Run agent E2E (CI subset)
        run: make test-agent-e2e

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: agent-e2e-artifacts
          path: target/agent-e2e-artifacts

  agent-fuzz:
    name: Agent protocol fuzz smoke
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt-get install -y libudev-dev

      - name: Install nightly toolchain
        shell: bash
        run: rustup toolchain install nightly --profile minimal

      - name: Install cargo-fuzz
        run: cargo +nightly install cargo-fuzz --locked

      - name: Run bounded fuzz smoke
        run: make test-agent-fuzz-smoke

  build:
    strategy:
      fail-fast: false
      matrix:
        job:
          # use ubuntu 22.04 to keep older glibc version dependency
          - {target: x86_64-unknown-linux-gnu, os: ubuntu-22.04}
          - {target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm}
    name: ${{ matrix.job.target }} (${{ matrix.job.os }})
    runs-on: ${{ matrix.job.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Update apt
        run: sudo apt update

      - name: Install udev and tss2
        run: sudo apt-get install -y libudev-dev libtss2-dev

      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup override set stable
          rustup target add ${{ matrix.job.target }}

      - name: Build
        shell: bash
        run: cargo build --verbose

      - name: Run tests
        shell: bash
        run: cargo test --verbose

      - name: Extract crate information
        shell: bash
        run: |
          echo "PROJECT_NAME=passless" >> $GITHUB_ENV
          echo "PROJECT_VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' ./Cargo.toml | head -n1)" >> $GITHUB_ENV

      - name: Make release
        shell: bash
        run: |
          export CARGO_TARGET=${{ matrix.job.target }}
          export PKG_BASE_NAME=${PROJECT_NAME}-${PROJECT_VERSION}-${CARGO_TARGET}
          make release

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    strategy:
      fail-fast: false
      matrix:
        job:
          - {target: x86_64-unknown-linux-gnu, os: ubuntu-22.04}
          - {target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm}
    name: Release ${{ matrix.job.target }} (${{ matrix.job.os }})
    runs-on: ${{ matrix.job.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Update apt
        run: sudo apt update

      - name: Install udev and tss2
        run: sudo apt-get install -y libudev-dev libtss2-dev

      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup override set stable
          rustup target add ${{ matrix.job.target }}

      - name: Extract crate information
        shell: bash
        run: |
          echo "PROJECT_NAME=passless" >> $GITHUB_ENV
          echo "PROJECT_VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' ./Cargo.toml | head -n1)" >> $GITHUB_ENV

      - name: Make release
        id: package
        shell: bash
        run: |
          export CARGO_TARGET=${{ matrix.job.target }}
          export PKG_BASE_NAME=${PROJECT_NAME}-${PROJECT_VERSION}-${CARGO_TARGET}
          make release
          echo "PKG_BASE_NAME=${PKG_BASE_NAME}" >> $GITHUB_OUTPUT

      - name: Generate SHA256 hash
        shell: bash
        run: |
          sha256sum ${{ steps.package.outputs.PKG_BASE_NAME }}.tar.gz > ${{ steps.package.outputs.PKG_BASE_NAME }}.tar.gz.sha256
          cat ${{ steps.package.outputs.PKG_BASE_NAME }}.tar.gz.sha256

      - name: Publish crates
        if: matrix.job.target == 'x86_64-unknown-linux-gnu'
        env:
          CRATES_IO_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        shell: bash
        run: |
          echo "${CRATES_IO_TOKEN}" | cargo login
          make publish || true

      - name: Get Changelog Entry
        id: changelog_reader
        uses: mindsers/changelog-reader-action@v2.4.0
        with:
          version: v${{ env.PROJECT_VERSION }}
          path: ./CHANGELOG.md

      - name: Prepare release files list
        id: release_files
        shell: bash
        run: |
          FILES="${{ steps.package.outputs.PKG_BASE_NAME }}.tar.gz"
          FILES="${FILES}"$'\n'"${{ steps.package.outputs.PKG_BASE_NAME }}.tar.gz.sha256"
          if [[ "${{ matrix.job.target }}" == "x86_64-unknown-linux-gnu" ]]; then
            FILES="${FILES}"$'\n'"vendor.tar.gz"
            FILES="${FILES}"$'\n'"passless-completions-${{ env.PROJECT_VERSION }}.tar.gz"
          fi
          echo "files<<EOF" >> $GITHUB_OUTPUT
          echo "$FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          body: ${{ steps.changelog_reader.outputs.changes }}
          prerelease: ${{ steps.changelog_reader.outputs.status == 'prereleased' }}
          draft: ${{ steps.changelog_reader.outputs.status == 'unreleased' }}
          files: ${{ steps.release_files.outputs.files }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
