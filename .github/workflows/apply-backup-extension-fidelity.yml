name: Complete credential backup extension fidelity

on:
  push:
    branches:
      - agent/complete-credential-backup
    paths:
      - .github/workflows/apply-backup-extension-fidelity.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.repository == 'pando85/passless'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/complete-credential-backup
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Preserve complete extension state
        shell: python
        run: |
          from pathlib import Path
          path = Path("cmd/passless/src/credential_backup.rs")
          src = path.read_text()

          replacements = [
              (
                  '''    cred_protect: Option<u8>,\n    cred_random: Option<SecBytes>,\n''',
                  '''    cred_protect: Option<u8>,\n    #[serde(default)]\n    hmac_secret: Option<bool>,\n    cred_random: Option<SecBytes>,\n''',
              ),
              (
                  '''            cred_protect: credential.extensions.cred_protect,\n            cred_random: credential.extensions.cred_random.clone(),\n''',
                  '''            cred_protect: credential.extensions.cred_protect,\n            hmac_secret: credential.extensions.hmac_secret,\n            cred_random: credential.extensions.cred_random.clone(),\n''',
              ),
              (
                  '''        let has_cred_random = self.cred_random.is_some();\n\n        Ok(Credential {\n''',
                  '''        Ok(Credential {\n''',
              ),
              (
                  '''                cred_protect: self.cred_protect,\n                hmac_secret: has_cred_random.then_some(true),\n                cred_random: self.cred_random,\n''',
                  '''                cred_protect: self.cred_protect,\n                hmac_secret: self.hmac_secret,\n                cred_random: self.cred_random,\n''',
              ),
          ]
          for old, new in replacements:
              if old not in src:
                  raise SystemExit(f"missing expected source fragment: {old!r}")
              src = src.replace(old, new, 1)

          marker = '''    #[test]\n    fn bundle_does_not_expose_private_key_plaintext() {\n'''
          test = '''    #[test]\n    fn round_trip_preserves_hmac_secret_state_independently_of_cred_random() {\n        let mut original = credential(CredentialBackupState::BackedUp);\n        original.extensions.hmac_secret = None;\n        assert!(original.extensions.cred_random.is_some());\n\n        let bundle =\n            encrypt_credential_with_key(&original, "backup-main", &test_key(0x12)).unwrap();\n        let outer = decode_bundle(&bundle).unwrap();\n        let restored = decrypt_bundle_with_key(outer, &test_key(0x12)).unwrap();\n\n        assert_eq!(restored.extensions.hmac_secret, None);\n        assert!(restored.extensions.cred_random.is_some());\n        assert_eq!(restored, original);\n    }\n\n'''
          if marker not in src:
              raise SystemExit("missing test insertion marker")
          src = src.replace(marker, test + marker, 1)
          path.write_text(src)
      - name: Format Rust sources
        run: cargo fmt --all
      - name: Remove one-shot workflow
        run: rm .github/workflows/apply-backup-extension-fidelity.yml
      - name: Commit extension-fidelity fix
        run: |
          git config user.name "openai-agent[bot]"
          git config user.email "openai-agent[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: preserve complete credential extension state"
          git push origin HEAD:agent/complete-credential-backup
