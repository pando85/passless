name: Issue 432 implementation wrapper

on:
  workflow_dispatch:

jobs:
  noop:
    runs-on: ubuntu-latest
    steps:
      - name: Source wrapper
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import subprocess

          source = Path('.github/issue-432-original-helper.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(source) if line.strip() == "python3 <<'PY'") + 1
          end = next(i for i in range(start, len(source)) if source[i].strip() == 'PY')
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in source[start:end]) + '\n'

          old_helper = '''def replace_exact(path, old, new, count=1):
    p = Path(path)
    text = p.read_text()
    found = text.count(old)
    if found != count:
        raise SystemExit(f"{path}: expected {count} occurrences, found {found}: {old[:100]!r}")
    p.write_text(text.replace(old, new, count))
'''
          new_helper = '''def replace_exact(path, old, new, count=1):
    p = Path(path)
    text = p.read_text()
    found = text.count(old)
    if found == count:
        p.write_text(text.replace(old, new, count))
        return

    target = [line.strip() for line in old.splitlines()]
    lines = text.splitlines(keepends=True)
    width = len(target)
    matches = []
    for index in range(0, len(lines) - width + 1):
        if [line.strip() for line in lines[index:index + width]] == target:
            matches.append(index)
    if len(matches) != count:
        raise SystemExit(
            f"{path}: expected {count} normalized occurrences, found {len(matches)}: {old[:100]!r}"
        )
    for index in reversed(matches):
        replacement = new
        if replacement and not replacement.endswith("\\n"):
            replacement += "\\n"
        lines[index:index + width] = [replacement]
    p.write_text(''.join(lines))
'''
          if old_helper not in script:
              raise SystemExit('could not locate original replace_exact helper')
          script = script.replace(old_helper, new_helper, 1)

          exec(compile(script, '/tmp/original-issue-432-implementation.py', 'exec'))

          # These are validation scaffolding only. Stage their deletion so the
          # successful implementation commit leaves no helper files in the PR diff.
          subprocess.run(
              [
                  'git', 'rm', '--',
                  '.github/workflows/issue-432-push-driver.yml',
                  '.github/issue-432-original-helper.yml',
              ],
              check=True,
          )
          PY
