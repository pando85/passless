    /// Create PIN storage sharing the credential backend's operation coordinator.
    pub fn new_with_sync(
        store_path: PathBuf,
        fido2_path: PathBuf,
        gpg_backend: GpgBackend,
        sync: PassGitSync,
    ) -> Self {
        debug!(
            "Pass PIN storage: store={}, path={}",
            store_path.display(),
            fido2_path.display()
        );
        let storage = Self {
            store_path,
            fido2_path,
            gpg_backend,
            sync,
            last_config: RwLock::new(None),
            last_synced: RwLock::new(None),
        };
        storage.sync.ensure_local_only_path(&storage.get_retries_path());
        storage
    }
