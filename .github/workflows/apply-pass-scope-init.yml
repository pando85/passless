name: Apply pass scope initialization patch

on:
  push:
    branches: [fix/pass-scope-initialization]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, 'capture patch diagnostics') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/pass-scope-initialization

      - name: Apply implementation
        shell: bash
        run: |
          if ! git apply --check --verbose .github/passless-scope-init.patch > /tmp/apply.log 2>&1; then
            cat /tmp/apply.log
            cp /tmp/apply.log .github/passless-scope-init-error.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/passless-scope-init-error.txt
            git commit -m "chore: capture patch diagnostics"
            git push origin HEAD:fix/pass-scope-initialization
            exit 1
          fi
          git apply .github/passless-scope-init.patch
          cargo fmt --all
          rm .github/passless-scope-init.patch
          rm .github/workflows/apply-pass-scope-init.yml

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(pass): make initialization respect configured scope"
          git push origin HEAD:fix/pass-scope-initialization
