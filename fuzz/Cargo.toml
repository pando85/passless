[package]
name = "passless-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde = "1"
serde_json = "1"
passless-core = { path = "../passless-core", features = ["agent"] }

[[bin]]
name = "agent_protocol_decode"
path = "fuzz_targets/agent_protocol_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "agent_request_validation"
path = "fuzz_targets/agent_request_validation.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
