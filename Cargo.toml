[workspace]
members = [".", "passless-config-doc"]
resolver = "2"

[workspace.package]
authors = ["Pando85 <pando855@gmail.com>"]
edition = "2024"
version = "0.3.2"
license-file = "./LICENSE"
homepage = "https://github.com/pando85/passless"
repository = "https://github.com/pando85/passless"

[package]
name = "passless-rs"
description = "FIDO2 security token emulator."
categories = ["command-line-utilities"]
keywords = ["passkeys", "fido2", "auth", "password-manager", "pass"]
readme = "./README.md"
include = ["src/**/*", "Cargo.toml", "LICENSE", "README.md", "contrib/**/*"]
authors.workspace = true
edition.workspace = true
license-file.workspace = true
homepage.workspace = true
repository.workspace = true
version.workspace = true

[[bin]]
name = "passless"
path = "src/main.rs"

[dependencies]
passless-config-doc = { path = "./passless-config-doc", version = "0.3.2" }
thiserror = "2.0"
clap = { version = "4.5", features = ["std", "color", "derive", "cargo", "env"] }
clap-serde-derive = "0.2"
#soft-fido2 = { path = "../soft-fido2/soft-fido2" }
#soft-fido2-transport = { path = "../soft-fido2/soft-fido2-transport" }
soft-fido2 = "0.2.1"
soft-fido2-transport = "0.2.1"
log = "0.4"
env_logger = "0.11"
sha2 = "0.10"
serde_cbor = "0.11.2"
serde = { version = "1.0.228", features = ["derive"] }
toml = "0.8"
dirs = "5.0"
prs-lib = { version = "0.5" }
serde_json = "1.0"
libc = "0.2"
nix = { version = "0.27", features = ["resource"] }
notify-rust = "4.11"
tss-esapi = "7.6.0"
aes-gcm = "0.10"
rand = "0.8"
hex = "0.4"
ctrlc = "3.4"

[dev-dependencies]
base64 = "0.22"
ciborium = "0.2"
tempfile = "3.14"

[build-dependencies]
clap = { version = "4.5", features = ["std", "color", "derive", "cargo", "env"] }
clap_complete = "4.5"

[profile.release]
codegen-units = 1
lto = "fat"
panic = "abort"
strip = "symbols"
