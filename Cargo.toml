[workspace]
members = [
    "cmd/passless",
    "passless-config-doc",
    "passless-core",
    "tools/agent-principal-probe",
    "tools/notify-double",
]
resolver = "2"

[workspace.package]
authors = ["Pando85 <pando855@gmail.com>"]
edition = "2024"
version = "0.26.0"
license-file = "./LICENSE"
repository = "https://github.com/pando85/passless"
[workspace.dependencies]
# Workspace crates
passless-core = { path = "./passless-core", version = "0.26.0" }
passless-config-doc = { path = "./passless-config-doc", version = "0.26.0" }

soft-fido2 = "0.18.0"
soft-fido2-ctap = "0.18.0"
soft-fido2-crypto = "0.18.0"
soft-fido2-transport = "0.18.0"

thiserror = "2.0"
clap = { version = "4.5", features = ["std", "color", "derive", "cargo", "env"] }
clap-serde-derive = "1.0"
clap_complete = "4.5"
log = "0.4"
env_logger = "0.11"
systemd-journal-logger = "2.2.2"
sha2 = "0.11"
serde_cbor = "0.11.2"
serde = { version = "1.0.228", features = ["derive"] }
toml = "1.0"
dirs = "7.0"
prs-lib = "0.5"
serde_json = "1.0"
libc = "0.2"
nix = { version = "0.31", features = ["resource", "fs", "signal", "process", "dir", "user"] }
notify-rust = "4.11"
aes-gcm = "0.11"
rand = "0.8"
ctrlc = "3.4"
signal-hook = "0.4"
zeroize = { version = "1.8", features = ["zeroize_derive"] }
hex = "0.4"
shadow-rs = "2.0"
psl = "2"
zbus = "6.0"
futures-lite = "2"

# Proc macro dependencies
syn = { version = "3.0", features = ["full", "extra-traits"] }
quote = "1.0"
proc-macro2 = "1.0"
darling = "0.24"

[profile.release]
codegen-units = 1
lto = "fat"
panic = "abort"
strip = "symbols"
