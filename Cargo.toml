[workspace]
members = ["cmd/passless", "passless-config-doc", "passless-core"]
resolver = "2"

[workspace.package]
authors = ["Pando85 <pando855@gmail.com>"]
edition = "2024"
version = "0.3.3"
license-file = "./LICENSE"
homepage = "https://github.com/pando85/passless"
repository = "https://github.com/pando85/passless"

[workspace.dependencies]
# Workspace crates
passless-core = { path = "./passless-core", version = "0.3.3" }
passless-config-doc = { path = "./passless-config-doc", version = "0.3.3" }

# External dependencies
thiserror = "2.0"
clap = { version = "4.5", features = ["std", "color", "derive", "cargo", "env"] }
clap-serde-derive = "0.2"
clap_complete = "4.5"
soft-fido2 = "0.2.1"
soft-fido2-transport = "0.2.1"
log = "0.4"
env_logger = "0.11"
sha2 = "0.10"
serde_cbor = "0.11.2"
serde = { version = "1.0.228", features = ["derive"] }
toml = "0.8"
dirs = "5.0"
prs-lib = "0.5"
serde_json = "1.0"
libc = "0.2"
nix = { version = "0.27", features = ["resource"] }
notify-rust = "4.11"
tss-esapi = "7.6.0"
aes-gcm = "0.10"
rand = "0.8"
hex = "0.4"
ctrlc = "3.4"

# Dev dependencies
base64 = "0.22"
ciborium = "0.2"
tempfile = "3.14"

# Proc macro dependencies
syn = { version = "2.0", features = ["full", "extra-traits"] }
quote = "1.0"
proc-macro2 = "1.0"
darling = "0.20"

[profile.release]
codegen-units = 1
lto = "fat"
panic = "abort"
strip = "symbols"
